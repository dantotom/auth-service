name: CI/CD - auth-service (prod only)

on:
  push:
    branches: [ "prod" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "prod" ]

permissions:
  contents: read
  packages: write

env:
  JAVA_VERSION: "21"
  IMAGE_NAME: ghcr.io/dantotom/auth-service

jobs:
  build-test:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Meta
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "git_tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "is_tag=false" >> $GITHUB_OUTPUT
            echo "git_tag=" >> $GITHUB_OUTPUT
          fi

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Test con profilo 'test'
      - name: Build & Test (Maven) - profile 'test'
        run: mvn -B -ntp -Dspring.profiles.active=test clean verify

      # Package jar
      - name: Package (Maven)
        run: mvn -B -ntp -DskipTests package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: error

  docker-publish:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare tags
        id: tags
        run: |
          SHORT="${{ needs.build-test.outputs.short_sha }}"
          TAGS="-t ${IMAGE_NAME}:sha-${SHORT}"
          if [ "${GITHUB_REF_NAME}" = "prod" ]; then
            TAGS="$TAGS -t ${IMAGE_NAME}:prod-latest -t ${IMAGE_NAME}:latest"
          fi
          if [ "${{ needs.build-test.outputs.is_tag }}" = "true" ]; then
            TAGS="$TAGS -t ${IMAGE_NAME}:tag-${{ needs.build-test.outputs.git_tag }}"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build image
        run: |
          docker build \
            --build-arg JAR_FILE="target/*.jar" \
            ${{ steps.tags.outputs.tags }} \
            -f Dockerfile .

      - name: Push all tags
        run: docker push --all-tags ${IMAGE_NAME}

  deploy-prod:
    runs-on: ubuntu-latest
    needs: docker-publish
    if: github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: prod
    steps:
      - name: Deploy to PROD via SSH (compose + health + rollback)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /opt/auth-service

            # 1) Scrivo .env sfruttando GitHub Secrets
            umask 077
            cat > .env << 'EOF'
            SPRING_DATASOURCE_URL=${{ secrets.PROD_DB_URL }}
            SPRING_DATASOURCE_USERNAME=${{ secrets.PROD_DB_USER }}
            SPRING_DATASOURCE_PASSWORD=${{ secrets.PROD_DB_PASS }}
            JWT_PRIVATE_KEY_PATH=/run/keys/jwt_private_key.pem
            JWT_PUBLIC_KEY_PATH=/run/keys/jwt_public_key.pem
            EOF

            # 2) Deploy immagine/tag
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              export TAG="tag-${GITHUB_REF_NAME}"
            else
              export TAG="prod-latest"
            fi
            docker login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

            # 3) Health check con retry e rollback
            CURRENT_TAG_FILE=".last_successful_tag"
            PREV_TAG="$( [ -f "$CURRENT_TAG_FILE" ] && cat "$CURRENT_TAG_FILE" || echo "prod-latest" )"
            HEALTH_URL="${{ secrets.PROD_HEALTH_URL }}"
            echo "Checking health at ${HEALTH_URL}"

            for i in $(seq 1 30); do
              STATUS=$(curl -sk "${HEALTH_URL}" | grep -o '"status":"[^"]*"' || true)
              if echo "$STATUS" | grep -q '"status":"UP"'; then
               echo "$TAG" > "$CURRENT_TAG_FILE"
                echo "Service is UP."
                exit 0
              fi
              sleep 2
            done

            echo "Health check failed. Rolling back to ${PREV_TAG}..."
            export TAG="$PREV_TAG"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml logs --no-color --tail=200 > deploy_fail_prod.log || true
            exit 1
